<main class="login-page">
  <form class="login-card" (ngSubmit)="submit()" autocomplete="on">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◎</span>
      <h1>Job Cards</h1>
      <p class="muted">Sign in to continue</p>
    </div>

    @if (error()) {
      <p class="banner error" role="alert">{{ error() }}</p>
    }

    <!-- Which business to work in. The desktop app decides this from its own
         executable name; here it is an explicit choice, and it cannot be
         changed without signing in again. -->
    <fieldset class="database">
      <legend>Job cards for</legend>
      <div class="choices">
        @for (option of databases; track option.value) {
          <label class="choice" [class.selected]="database() === option.value">
            <input
              type="radio"
              name="database"
              [value]="option.value"
              [checked]="database() === option.value"
              [disabled]="busy()"
              (change)="database.set(option.value)"
            />
            <span class="choice-label">{{ option.label }}</span>
          </label>
        }
      </div>
    </fieldset>

    <div class="field">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        enterkeyhint="next"
        [disabled]="busy()"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
      />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input
          id="password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          enterkeyhint="go"
          [disabled]="busy()"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
        <button
          type="button"
          class="subtle reveal"
          (click)="toggleShowPassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
    </div>

    <button type="submit" class="primary submit" [disabled]="busy()">
      @if (busy()) {
        <span class="spin" aria-hidden="true"></span>
        <span>Checking…</span>
      } @else {
        <span>Sign in</span>
      }
    </button>

    @if (busy()) {
      <p class="muted hint" aria-live="polite">
        Verifying your credentials with the server.
      </p>
    }
  </form>
</main>
