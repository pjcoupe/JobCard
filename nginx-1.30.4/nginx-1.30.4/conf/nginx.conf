# nginx for the Job Card web app (jobcard.duckdns.org)
#
# This machine runs everything: MongoDB (27017), the Node API (localhost:3000),
# and this nginx, which is the only part facing the internet.
#
# Site configuration lives in conf/sites/. Files ending in .conf are loaded;
# anything ending in .disabled is ignored, which is how the HTTPS block stays
# out of the way until win-acme has issued a certificate.
#
# The stock configuration this replaced is kept as nginx.conf.default-backup.
#
# Test changes with:   nginx.exe -t -p C:/jobcard/nginx-1.30.4/nginx-1.30.4
# Apply them with:     nginx.exe -s reload -p C:/jobcard/nginx-1.30.4/nginx-1.30.4

# One worker is the right number on Windows: nginx's Windows build does not share
# a listen socket between workers, so extra ones buy nothing here.
worker_processes  1;

error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Angular's build emits .mjs chunks. Without this they are served as
    # octet-stream and the browser refuses to execute them as modules.
    types {
        application/javascript  mjs;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    # Do not advertise the exact nginx version in headers or error pages.
    server_tokens  off;

    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;

    # Photo and video uploads. The API's own ceiling is MAX_PHOTO_BYTES (25 MB by
    # default); this is deliberately a little higher so an oversized upload is
    # refused by the API with a JSON error the app can display, rather than by
    # nginx with an HTML 413 it cannot parse.
    client_max_body_size  32m;
    client_body_timeout   300s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        text/plain
                      text/css
                      text/xml
                      application/javascript
                      application/json
                      application/manifest+json
                      application/xml
                      image/svg+xml
                      font/woff
                      font/woff2;

    include  sites/*.conf;
}
