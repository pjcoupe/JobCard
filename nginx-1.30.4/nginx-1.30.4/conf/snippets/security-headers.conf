# Response headers applied to every reply.
#
# This is a file rather than a few lines in the server block because of an nginx
# rule that catches people out: add_header directives in a location REPLACE the
# ones inherited from the server, they do not add to them. So every location that
# sets a header of its own (the caching ones do) has to restate these, and
# including one file is the only way to do that without them drifting apart.

# Do not let a browser second-guess a Content-Type. Stops a file that is really
# HTML from being treated as a script, and vice versa.
add_header  X-Content-Type-Options  "nosniff"  always;

# Refuse to be framed by another site, which is what a clickjacking attempt needs.
add_header  X-Frame-Options  "SAMEORIGIN"  always;

# Send the full URL as a referrer only within this site; send just the origin
# elsewhere, so job numbers and customer names never leak in a Referer header.
add_header  Referrer-Policy  "strict-origin-when-cross-origin"  always;

# Tell the browser to reach this host over HTTPS for the next 180 days, even if a
# link says http://. Closes the gap where the very first request of the day goes
# out in clear text before the redirect answers.
#
# Note this is sticky: a browser that has seen this header will refuse plain HTTP
# to jobcard.duckdns.org until it expires, and clearing it early means clearing
# it on each device. If you ever need to serve this host over HTTP again, comment
# this line out well in advance. includeSubDomains and preload are deliberately
# absent -- neither is wanted for a single hostname under duckdns.org.
add_header  Strict-Transport-Security  "max-age=15552000"  always;
