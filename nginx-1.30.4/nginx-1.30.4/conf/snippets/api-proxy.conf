# Hand /api/* to the Node API on localhost:3000.
#
# Node deliberately listens on localhost only, so this proxy is the sole route to
# it. Nothing needs forwarding at the router for port 3000, and nothing on the
# office LAN can reach the API except through nginx.

proxy_pass  http://127.0.0.1:3000;

# 1.1 rather than the 1.0 default: no chunked-encoding surprises on uploads.
proxy_http_version  1.1;

# The API sees the real client and the real scheme, not "this came from nginx
# over HTTP". Host is passed through so redirects and the Xero callback build
# URLs with jobcard.duckdns.org in them rather than 127.0.0.1.
proxy_set_header  Host               $host;
proxy_set_header  X-Real-IP          $remote_addr;
proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header  X-Forwarded-Proto  $scheme;
proxy_set_header  X-Forwarded-Host   $host;

# Photo uploads are large and phone connections are slow, and a Xero sync can sit
# waiting on Xero's own API. The 60s default cuts both off mid-flight.
proxy_connect_timeout  15s;
proxy_send_timeout     300s;
proxy_read_timeout     300s;

# Stream a photo upload straight through to Node instead of spooling all 25 MB to
# disk first. Node applies its own MAX_PHOTO_BYTES limit as the body arrives.
proxy_request_buffering  off;
