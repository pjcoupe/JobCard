# A copy of the site on http://127.0.0.1:8080, for diagnosing faults.
#
# Bound to the loopback address, so it is reachable only from a console on this
# machine -- not from the office LAN and not from the internet, regardless of what
# the router or the firewall allow.
#
# Its purpose is to split "the app is broken" from "TLS is broken". If this URL
# works and https://jobcard.duckdns.org does not, the fault is in the certificate,
# the port forward, or DNS -- not in nginx, Node, or the Angular build.
#
# It is also what lets the site be tested before the first certificate exists.
# Delete this file and reload nginx if you would rather it were not there.

server {
    listen       127.0.0.1:8080;
    server_name  localhost;

    root  C:/jobcard/webappUI/dist/webapp-ui/browser;

    # "^~" for the same reason as the real site: keep API paths away from any
    # regex location that might be added here later.
    location ^~ /api/ {
        include  snippets/api-proxy.conf;
    }

    location / {
        try_files  $uri  $uri/  /index.html;
    }

    access_log  logs/diagnostic.log  main;
}
