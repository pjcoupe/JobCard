# Port 80. Two jobs only: answer Let's Encrypt's challenge, and push everyone
# to HTTPS. No application content is served over plain HTTP -- the password and
# the session token travel on every request, and this is a home/office internet
# connection.
#
# Port 80 has to stay open and forwarded at the router permanently, not just for
# the first certificate: win-acme re-validates the same way on every renewal.

server {
    # IPv4 only: the DuckDNS record is an A record and the office connection is
    # IPv4, so an IPv6 listener would only add a way for nginx to fail to bind.
    listen       80  default_server;
    server_name  jobcard.duckdns.org;

    # win-acme writes its proof-of-control file below this directory, under
    # .well-known/acme-challenge/, and Let's Encrypt fetches it over plain HTTP.
    # This location must come before the redirect, or the challenge would be
    # redirected to HTTPS and validation would fail on a not-yet-valid cert.
    location /.well-known/acme-challenge/ {
        alias  C:/certs/acme-webroot/.well-known/acme-challenge/;

        # The challenge file has no extension; without this it is served as
        # octet-stream, which Let's Encrypt tolerates but is untidy.
        default_type  text/plain;

        # win-acme only writes a web.config here if --manualtargetisiis is passed,
        # which the setup script does not do. Denied anyway: it costs nothing and
        # means a future change of validation plugin cannot start publishing one.
        location ~* /web\.config$ {
            deny  all;
        }

        access_log  logs/acme.log  main;
    }

    location / {
        return  301  https://jobcard.duckdns.org$request_uri;
    }
}
