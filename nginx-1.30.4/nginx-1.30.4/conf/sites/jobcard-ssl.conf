# Port 443 -- the real site.
#
# This file is named .disabled because nginx refuses to start if an
# ssl_certificate file is missing, and the certificate does not exist until
# win-acme has run once. setup-admin.ps1 renames it to jobcard-ssl.conf after the
# certificate is in place; nginx.conf loads sites/*.conf, so the rename is all it
# takes.

server {
    listen       443  ssl  default_server;
    http2        on;
    server_name  jobcard.duckdns.org;

    # Written by win-acme's pemfiles store on issue and on every renewal.
    #   -chain.pem is the certificate plus the intermediate, which is what nginx
    #   wants -- serving -crt.pem alone would validate in a desktop browser (it
    #   caches intermediates) but fail on some phones, the classic "works on my
    #   machine" TLS bug.
    ssl_certificate      C:/certs/jobcard.duckdns.org-chain.pem;
    ssl_certificate_key  C:/certs/jobcard.duckdns.org-key.pem;

    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  off;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    include  snippets/security-headers.conf;

    root  C:/jobcard/webappUI/dist/webapp-ui/browser;

    # The API. Must precede location / so it is not treated as an Angular route.
    #
    # "^~" is load-bearing, not decoration: without it a plain prefix location
    # loses to any matching regex location, so a photo URL ending in .jpg --
    # /api/photos/jobs/10427/10427 Ali ... 001.jpg -- would fall into the static
    # asset block below, be looked for on disk under the Angular dist folder, and
    # 404. That block also turns access_log off, so the failures left no trace.
    location ^~ /api/ {
        include  snippets/api-proxy.conf;

        # Restated because a location's add_header replaces the server's rather
        # than adding to it -- see snippets/security-headers.conf.
        include  snippets/security-headers.conf;
    }

    # Assets carry a content hash in the filename (Angular's outputHashing: all),
    # so a given URL's contents can never change and the browser never needs to
    # re-check. This is what makes a reload on a phone feel instant.
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico|map)$ {
        # Deliberately NOT "always": that would put a one-year immutable header on
        # error responses too, so a URL this block 404s gets cached as missing for
        # a year and the browser stops asking even after the fault is fixed. That
        # is exactly what happened to the photo URLs above. Without "always" the
        # header still covers 200 and 304, which is all a real asset needs.
        add_header  Cache-Control  "public, max-age=31536000, immutable";
        include     snippets/security-headers.conf;
        access_log  off;
        try_files   $uri  =404;
    }

    # index.html is the one file with a stable URL, so it must never be cached:
    # it is what points at the current hashed bundles. Cache it and a deploy would
    # leave browsers loading chunk filenames that no longer exist.
    location = /index.html {
        add_header  Cache-Control  "no-store"  always;
        include     snippets/security-headers.conf;
    }

    # Angular routes such as /jobs/123 are not files on disk. Without this,
    # reloading the page or opening a bookmarked job returns 404.
    location / {
        include    snippets/security-headers.conf;
        try_files  $uri  $uri/  /index.html;
    }

    # Nothing here should ever serve a dotfile.
    location ~ /\. {
        deny  all;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root  html;
    }
}
